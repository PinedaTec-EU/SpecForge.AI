# SpecForge workflow graph layout
# Edit x/y coordinates to reposition cards in the workflow graph.
# Card dimensions used by the renderer: desktop 240x118, mobile 206x118.
# Connection anchors use T1..T5, R1..R5, B1..B5, L1..L5.
horizontal:
  capture:
    x: 80
    y: 120
  refinement:
    x: 390
    y: 120
  spec:
    x: 700
    y: 120
  technical-design:
    x: 1010
    y: 120
  implementation:
    x: 1010
    y: 340
  review:
    x: 1010
    y: 560
  release-approval:
    x: 1320
    y: 560
  pr-preparation:
    x: 1630
    y: 560
  completed:
    x: 1940
    y: 560
  legend:
    x: 20
    y: 720
  connections:
    capture->refinement:
      from: R3
      to: L3
    refinement->spec:
      from: R3
      to: L3
    spec->technical-design:
      from: R3
      to: L3
    technical-design->implementation:
      from: B3
      to: T3
    implementation->review:
      from: B3
      to: T3
    review->release-approval:
      from: R3
      to: L3
    release-approval->pr-preparation:
      from: R3
      to: L3
    pr-preparation->completed:
      from: R3
      to: L3
  loops:
    implementation-review:
      fromPhaseId: implementation
      toPhaseId: review
      side: right

aggregate:
  positions:
    capture:
      x: 56
      y: 140
    refinement:
      x: 336
      y: 140
    spec:
      x: 336
      y: 332
    split:
      x: 56
      y: 524
  spacing:
    horizontalPadding: 56
    topRowTop: 140
    topRowGap: 56
    rowGap: 192
    childGap: 56
    maxChildrenPerRow: 2

vertical:
  capture:
    x: 80
    y: 60
  refinement:
    x: 390
    y: 60
  spec:
    x: 390
    y: 240
  technical-design:
    x: 390
    y: 420
  implementation:
    x: 390
    y: 600
  review:
    x: 390
    y: 780
  release-approval:
    x: 390
    y: 960
  pr-preparation:
    x: 390
    y: 1140
  completed:
    x: 390
    y: 1320
  legend:
    x: 20
    y: 250
  connections:
    capture->refinement:
      from: R3
      to: L3
    refinement->spec:
      from: B3
      to: T3
    spec->technical-design:
      from: B3
      to: T3
    technical-design->implementation:
      from: B3
      to: T3
    implementation->review:
      from: B3
      to: T3
    review->release-approval:
      from: B3
      to: T3
    release-approval->pr-preparation:
      from: B3
      to: T3
    pr-preparation->completed:
      from: B3
      to: T3
  loops:
