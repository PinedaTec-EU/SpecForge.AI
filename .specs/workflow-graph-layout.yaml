# SpecForge workflow graph layout
# Edit x/y coordinates to reposition cards in the workflow graph.
# Card dimensions used by the renderer: desktop 240x118, mobile 206x118.
# Connection anchors use T1..T5, R1..R5, B1..B5, L1..L5.
horizontal:
  capture:
    x: 80
    y: 120
  refinement:
    x: 192
    y: 312
  spec:
    x: 312
    y: 504
  technical-design:
    x: 456
    y: 696
  implementation:
    x: 744
    y: 504
  review:
    x: 864
    y: 312
  release-approval:
    x: 1032
    y: 120
  pr-preparation:
    x: 1344
    y: 264
  completed:
    x: 1704
    y: 264
  legend:
    x: 24
    y: 480
  connections:
    capture->refinement:
      from: R3
      to: L3
    refinement->spec:
      from: R3
      to: L3
    spec->technical-design:
      from: R3
      to: L3
    technical-design->implementation:
      from: B3
      to: T3
    implementation->review:
      from: B3
      to: T3
    review->release-approval:
      from: R3
      to: L3
    release-approval->pr-preparation:
      from: R3
      to: L3
    pr-preparation->completed:
      from: R3
      to: L3
  loops:
    implementation-review:
      fromPhaseId: implementation
      toPhaseId: review
      side: right

